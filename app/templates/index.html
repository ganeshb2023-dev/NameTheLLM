<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Name That LLM</title>
<style>
:root{--bg:#f7f7f5;--fg:#1c1c1a;--card:#fff;--bd:#dcdcd6;--ac:#2f5bea;--mut:#6b6b66}
@media(prefers-color-scheme:dark){:root{--bg:#161617;--fg:#ececea;--card:#202022;--bd:#34343a;--ac:#7c9cff;--mut:#9a9a96}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 18px}
h1{margin:0 0 4px}p.s{color:var(--mut);margin:0 0 20px}
textarea{width:100%;box-sizing:border-box;min-height:200px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);font:inherit;resize:vertical}
button{margin-top:12px;padding:10px 20px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}
button:disabled{opacity:.5}
.card{margin-top:20px;padding:16px;background:var(--card);border:1px solid var(--bd);border-radius:10px}
.row{display:flex;align-items:center;gap:10px;margin:6px 0}.row span:first-child{width:200px;overflow:hidden;text-overflow:ellipsis}
.bar{flex:1;height:10px;background:var(--bd);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.err{color:#c0392b}.warn{color:#b9770e}
</style></head><body><main>
<h1>Name That LLM</h1>
<p class="s">Paste a passage (40–250 words works best) and the model guesses which of 18 LLMs wrote it.</p>
{% if not ready %}<p class="warn">No trained model found. Run <code>python scripts/train.py</code> first.</p>{% endif %}
<textarea id="t" placeholder="Paste text here…"></textarea>
<button id="b">Identify model</button>
<div id="out"></div>
<script>
const b=document.getElementById('b'),o=document.getElementById('out');
b.onclick=async()=>{
  b.disabled=true;o.innerHTML='';
  try{
    const r=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:document.getElementById('t').value})});
    const d=await r.json();
    if(!r.ok){o.innerHTML='<p class="err">'+d.error+'</p>';return;}
    o.innerHTML='<div class="card"><h2 style="margin:0 0 8px">'+d.prediction+'</h2>'+
      d.top.map(x=>'<div class="row"><span>'+x.model+'</span><div class="bar"><i style="width:'+(x.score*100)+'%"></i></div><span>'+(x.score*100).toFixed(1)+'%</span></div>').join('')+'</div>';
  }catch(e){o.innerHTML='<p class="err">Request failed.</p>';}
  finally{b.disabled=false;}
};
</script></main></body></html>
